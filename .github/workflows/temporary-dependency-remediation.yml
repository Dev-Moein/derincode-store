name: Temporary dependency remediation

on:
  push:
    branches:
      - 'security/ci-hardening-2026-10'

permissions:
  contents: read

jobs:
  update-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/security/ci-hardening-2026-10'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply compatible dependency security updates
        working-directory: frontend
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit lockfile updates if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "security: update vulnerable frontend dependencies"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:security/ci-hardening-2026-10
